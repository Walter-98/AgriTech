<title>Gemello AgriTech</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: scena 3D grande in testa con i comandi sovrapposti, numeri chiave, poi schede di lavoro a colonna larga */
:root {
  --bg: #f3f5f1; --carta: #fbfcfa; --ink: #16201a; --ink-2: #4a554d; --muted: #77817a; --riga: #dfe4dc; --asse: #c2cabf;
  --accent: #2f6b45; --accent-soft: #e3eee5; --scelta: #e9f2ea;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --ok-ink: #006300; --warn-ink: #8a5d00; --crit-ink: #b02a2a;
  --f-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f1311; --carta: #171c19; --ink: #e9eee9; --ink-2: #b9c3bb; --muted: #87918a; --riga: #29302b; --asse: #3a433d;
    --accent: #7cc296; --accent-soft: #1d2a22; --scelta: #1b2a21; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --ok-ink: #3fc43f; --warn-ink: #f0b43a; --crit-ink: #ef7373; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0f1311; --carta: #171c19; --ink: #e9eee9; --ink-2: #b9c3bb; --muted: #87918a; --riga: #29302b; --asse: #3a433d;
  --accent: #7cc296; --accent-soft: #1d2a22; --scelta: #1b2a21; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --ok-ink: #3fc43f; --warn-ink: #f0b43a; --crit-ink: #ef7373; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
.pagina { max-width: 1180px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: clamp(1.9rem, 4vw, 2.7rem); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 1.5rem; font-weight: 600; }
h3 { font-size: 1.08rem; font-weight: 600; }
p { margin: 0; max-width: 72ch; }
.piccolo { font-size: 0.875rem; color: var(--ink-2); }
.etichetta { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.dati { font-family: var(--f-data); font-size: 0.85rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header.testa { padding-block: 22px 14px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.modo { display: inline-flex; background: var(--carta); border: 1px solid var(--riga); border-radius: 999px; padding: 4px; gap: 4px; }
.modo button { font: 600 0.95rem var(--f-body); border: 0; background: none; color: var(--ink-2); padding: 8px 16px; border-radius: 999px; cursor: pointer; }
.modo button[aria-pressed="true"] { background: var(--accent); color: var(--carta); }
.scena-box { position: relative; border-radius: 18px; overflow: hidden; background: #b9cddd; height: clamp(440px, 68vh, 680px); border: 1px solid var(--riga); }
#scena { position: absolute; inset: 0; }
#scena canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; display: grid; gap: 5px; padding: 10px 12px; border-radius: 12px; font-size: 0.84rem; color: var(--ink);
  background: color-mix(in srgb, var(--carta) 84%, transparent); border: 1px solid color-mix(in srgb, var(--riga) 70%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); max-width: calc(100% - 24px); }
.hud-alto { top: 12px; left: 12px; min-width: 230px; }
.hud-info { top: 12px; right: 12px; width: min(320px, calc(100% - 24px)); }
.hud-info.vuoto { display: none; }
.hud-basso { left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.hud .data { font: 700 1.15rem var(--f-display); }
.hud input[type="range"] { flex: 1 1 160px; accent-color: var(--accent); padding: 0; border: 0; background: none; min-width: 0; }
.hud select { width: auto; }
.hud-basso .gruppo { display: flex; align-items: center; gap: 6px; flex: 1 1 220px; min-width: 0; }
#inquadrature { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 100%; }
.chipbtn { font: 600 0.8rem var(--f-body); border: 1px solid var(--asse); background: var(--carta); color: var(--ink); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.chipbtn:hover { border-color: var(--accent); color: var(--accent); }
.zchip { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.zchip .barra { flex: 1; height: 6px; border-radius: 3px; background: var(--riga); overflow: hidden; min-width: 50px; }
.zchip .barra span { display: block; height: 100%; border-radius: 3px; }
.avviso { font-size: 0.8rem; font-weight: 600; }
.avviso.crit { color: var(--crit-ink); } .avviso.warn { color: var(--warn-ink); } .avviso.ok { color: var(--ok-ink); }
.giocatore { width: 2.3rem; height: 2.3rem; border-radius: 50%; padding: 0; display: grid; place-items: center; font-size: 1rem; flex: none; }
.scena-nota { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #16201a; }
@media (max-width: 680px) {
  .scena-box { height: clamp(520px, 82vh, 700px); }
  .hud { font-size: 0.76rem; padding: 8px 10px; } .hud .data { font-size: 1rem; }
  .hud-alto { max-width: 66%; min-width: 0; } .hud-info { top: auto; bottom: 128px; }
  .hud-basso .lbl { display: none; }
}
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 1px; background: var(--riga); border: 1px solid var(--riga); border-radius: 14px; overflow: hidden; margin-block: 14px; }
.kpi > div { background: var(--carta); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi .val { font-size: 1.45rem; font-weight: 700; line-height: 1.2; }
.kpi .sotto { font-size: 0.8rem; color: var(--ink-2); }
nav.schede { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--riga); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
nav.schede button { font: 600 0.95rem var(--f-body); color: var(--ink-2); background: none; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
nav.schede button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
#contenuto { padding-block: 22px; display: grid; gap: 18px; }
.blocco { display: grid; gap: 12px; min-width: 0; align-content: start; }
.riquadro { background: var(--carta); border: 1px solid var(--riga); border-radius: 14px; padding: 18px; min-width: 0; }
.due { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.tre { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; align-items: start; margin-top: 16px; }
.testa-riga { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.campi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }
label.campo { display: grid; gap: 4px; font-size: 0.875rem; color: var(--ink-2); font-weight: 600; }
input, select { font: 400 1rem var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--asse); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin-top: 2px; }
.spunta { display: flex; gap: 8px; align-items: flex-start; font-size: 0.95rem; color: var(--ink); }
button.az { font: 600 0.92rem var(--f-body); background: var(--accent); color: var(--carta); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; justify-self: start; }
button.az.sec { background: none; color: var(--accent); border: 1px solid var(--accent); }
button.az:disabled { opacity: 0.45; cursor: not-allowed; }
button.link { font: 600 0.85rem var(--f-body); background: none; border: 0; color: var(--accent); padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; justify-self: start; }
.opzioni { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.opzione { text-align: left; display: grid; gap: 3px; align-content: start; background: var(--bg); border: 1px solid var(--riga); border-radius: 12px; padding: 10px 12px; cursor: pointer; color: var(--ink); font: inherit; }
.opzione:hover { border-color: var(--asse); }
.opzione.scelta { background: var(--scelta); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.op-nome { font-weight: 700; font-size: 0.95rem; }
.op-dett { font-size: 0.8rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.op-pro, .op-contro { font-size: 0.8rem; }
.op-pro { color: var(--ok-ink); } .op-contro { color: var(--warn-ink); }
.evidenzia { animation: lampo 1.6s ease; border-radius: 12px; }
@keyframes lampo { 0%, 60% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .evidenzia { animation: none; outline: 2px solid var(--accent); } }
.scorri { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--riga); vertical-align: top; }
th { font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.zone td { vertical-align: middle; } table.zone input[type="number"] { width: 5em; }
table.guida td { font-size: 0.85rem; }
.pallino { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; flex: none; }
.msg { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 11px 2px; border-bottom: 1px solid var(--riga); }
.msg:last-child { border-bottom: 0; }
.msg > div { display: grid; gap: 2px; min-width: 0; }
.chip { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; align-self: start; border: 1px solid currentColor; }
.chip.ok { color: var(--ok-ink); } .chip.warn { color: var(--warn-ink); } .chip.crit { color: var(--crit-ink); }
.chip.ok::before { content: "✓ "; } .chip.warn::before { content: "! "; } .chip.crit::before { content: "✕ "; }
.mat { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--riga); }
.mat:last-child { border-bottom: 0; }
.mat .perche { grid-column: 1 / -1; font-size: 0.85rem; color: var(--ink-2); }
.mat .link { grid-column: 1 / -1; }
.liv { white-space: nowrap; font-size: 0.7rem; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
.lista { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 0.92rem; }
.grafico { position: relative; } .grafico svg { width: 100%; height: auto; display: block; }
.grafico text { fill: var(--muted); font: 12px var(--f-body); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--ink-2); }
.legenda i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.legenda i.box { height: 10px; width: 10px; border-radius: 2px; }
.tip { position: absolute; pointer-events: none; background: var(--carta); border: 1px solid var(--asse); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; box-shadow: 0 4px 14px rgba(0,0,0,0.12); min-width: 150px; z-index: 3; }
.tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; } .tip .r b { font-variant-numeric: tabular-nums; }
.tip .k { display: inline-block; width: 12px; height: 2px; margin-right: 6px; vertical-align: middle; }
.passi { display: grid; counter-reset: passo; }
.passo { display: grid; grid-template-columns: 2.4rem 1fr; gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--riga); }
.passo:last-child { border-bottom: 0; }
.passo::before { counter-increment: passo; content: counter(passo); font: 700 1.05rem var(--f-display); color: var(--accent); width: 2rem; height: 2rem; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; }
.passo > div { display: grid; gap: 4px; min-width: 0; }
pre { font-family: var(--f-data); font-size: 0.8rem; background: var(--bg); border: 1px solid var(--riga); border-radius: 8px; padding: 10px; overflow-x: auto; margin: 0; }
details > summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 0.9rem; }
.scorri svg text { fill: var(--muted); }
.doc-sezione { break-inside: avoid-page; }
.doc-testa { border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 16px; }
@media print {
  body { background: #fff !important; }
  header, .scena-box, #kpi, nav.schede, .no-stampa, button, input[type=file], .riquadro.blocco:has(#messaggi) { display: none !important; }
  .riquadro { box-shadow: none !important; border: 1px solid #ccc !important; break-inside: avoid; }
  .doc-sezione { break-before: auto; }
  a { color: inherit; text-decoration: none; }
  .scorri { overflow: visible !important; }
  .scorri > svg, .riquadro svg { max-width: 100% !important; height: auto !important; }
}
</style>

<div class="pagina">
  <header class="testa">
    <div style="display:grid;gap:6px">
      <span class="etichetta">AgriTech · gemello digitale</span>
      <h1>Gemello AgriTech</h1>
      <p class="piccolo">Costruisci il tuo impianto pezzo per pezzo e guardalo vivere un anno: acqua, corrente, clima, raccolto, costi e guasti, prima di comprare qualcosa.</p>
    </div>
    <div class="modo" role="group" aria-label="Tipo di impianto">
      <button type="button" data-m="orto" aria-pressed="true">Orto in terra</button>
      <button type="button" data-m="idro" aria-pressed="false">Idroponica in garage</button>
    </div>
  </header>

  <div class="scena-box" id="scena-box">
    <div id="scena" aria-label="Vista 3D: trascina per ruotare, rotella o due dita per lo zoom, clicca un oggetto per sapere cos'è e cambiarlo"></div>
    <div class="hud hud-alto" id="hud-stato" aria-live="polite"></div>
    <div class="hud hud-info vuoto" id="hud-info"></div>
    <div class="hud hud-basso">
      <button class="az giocatore" id="gioca" type="button" aria-label="Avvia l'anno">▶</button>
      <div class="gruppo"><label class="piccolo lbl" for="giorno">Giorno</label><input type="range" id="giorno" min="0" max="364" step="1" value="196"></div>
      <div class="gruppo"><label class="piccolo lbl" for="ora">Ora</label><input type="range" id="ora" min="0" max="23" step="1" value="11"></div>
      <select id="velocita" aria-label="Velocità"><option value="1">1 giorno/s</option><option value="5" selected>5 giorni/s</option><option value="15">15 giorni/s</option></select>
      <div id="inquadrature" aria-label="Inquadrature"></div>
    </div>
  </div>

  <div class="kpi" id="kpi" aria-live="polite"></div>
  <div class="riquadro blocco"><h3>Cosa ti dice il gemello</h3><div id="messaggi"></div></div>

  <nav class="schede" id="schede" role="tablist" aria-label="Sezioni"></nav>
  <main id="contenuto"></main>
</div>
