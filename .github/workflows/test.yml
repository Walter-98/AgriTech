name: Collaudo virtuale
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test logica, scenari e firmware
        run: python -m unittest discover -s test -t . -v
      - name: Riepilogo scenari
        run: python -m sistema.simula tutti
