name: Collaudo virtuale
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test numerici del gemello (motore idroponico)
        run: node --test test/js/test_*.js
      - name: Controllo sintassi del gemello
        run: for f in gemello/*.js; do node --check "$f"; done
      - name: Test logica, scenari, firmware e monitoraggio
        run: |
          pip install pyyaml
          python -m unittest discover -s test -t . -v
      - name: Validazione della configurazione ESPHome
        run: |
          pip install esphome
          cd monitoraggio/esphome
          printf 'wifi_ssid: "x"\nwifi_password: "xxxxxxxx"\nap_password: "xxxxxxxx"\napi_key: "%s"\nota_password: "x"\n' "$(openssl rand -base64 32)" > secrets.yaml
          esphome config idroponica.yaml
      - name: Riepilogo scenari
        run: python -m sistema.simula tutti
      - name: Problemi e soluzioni a confronto
        run: python -m sistema.soluzioni --file soluzioni-ci.md
  browser:
    # La pagina vera in Chromium, senza rete: fallisce se il gemello non si apre o non si usa,
    # anche quando i test numerici passano (es. due script con lo stesso nome, file mancanti, errori dell'interfaccia)
    # Playwright 1.56 non supporta ancora Ubuntu 26.04 (ubuntu-latest): sistema fisso finché non lo supporta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright e Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Prove nel browser
        run: node --test --test-concurrency=1 test/browser/test_browser.js
